<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="icon" href="{{ "/" | absURL }}images/nkim_logo.svg" type="image/svg+xml">

  <link rel="stylesheet" href="{{ "/css/main.css" | absURL }}">
  <link rel="stylesheet" href="{{ "/css/pages/singlepage.css" | absURL }}">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.2/dist/katex.min.css">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.2/dist/katex.min.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.2/dist/contrib/auto-render.min.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    });
  </script>

</head>

<body>

  <div class="page-layout">

    <main class="content">

      <h1>{{ .Title }}</h1>

      <div class="post-date">
        {{ dateFormat "Monday, Jan 2, 2006" .Date }}
      </div>

      <article>
        {{ .Content }}
      </article>

    <hr>

    </main>

  </div>

  {{ partial "footer" . }}

</body>

</html>
